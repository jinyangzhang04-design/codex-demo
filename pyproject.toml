[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drugscreen"
version = "0.1.0"
description = "Multi-task molecular druggability prediction and virtual screening"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "rdkit>=2023.9"]

[project.scripts]
drugscreen = "drugscreen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
ml = ["torch>=2.2"]
